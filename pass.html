<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="bootstrap-local.css" rel="stylesheet">
    <link href="site.css" rel="stylesheet">
    <title>门条</title>
</head>

<body>
<div class="bind-header">
    <img src="assets/brand.jpg" alt="账号">
</div>
<div id="out-container">
<table class="table table-striped table-bordered table-hover table-condensed">
    <tbody>
    <tr>
        <td style="text-align:center">
            <img style="width:80px;height:106px" src="assets/not-found.jpg">
        </td>
    </tr>
    <tr>
        <td style="text-align:center">
            <h4>
                <span class="label label-success">
                    门条有效,可以出门
                </span>
            </h4>
        </td>
    </tr>
    <tr>
        <td style="text-align:center">
            <button type="button" onclick="closeWin()" class="btn btn-info">关闭</button>
        </td>
    </tr>
    </tbody>
</table>
<script>
    document.title = '门条';
    function closeWin() {
        if (typeof WeixinJSBridge !== 'undefined' && WeixinJSBridge.call) {
            WeixinJSBridge.call('closeWindow');
        } else {
            window.close();
        }
    }
</script>
</div>
</body>
</html>
