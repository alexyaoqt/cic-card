<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请输入信息</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        .choice-group {
            margin-bottom: 20px;
            text-align: left;
            padding-left: 20px;
        }
        .choice-label {
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }
        label {
            margin-right: 18px;
            cursor: pointer;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
        }
        #teacherSelect {
            width: calc(100% - 20px);
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
            font-size: 16px;
            box-sizing: border-box;
        }
        .pin-input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            letter-spacing: 0.25em;
            text-align: center;
        }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>欢迎</h2>

        <div class="choice-group">
            <span class="choice-label">性别：</span>
            <label><input type="radio" name="gender" value="男" checked> 男</label>
            <label><input type="radio" name="gender" value="女"> 女</label>
        </div>

        <div class="choice-group">
            <span class="choice-label">年级：</span>
            <label><input type="radio" name="grade" value="11年级"> 11年级</label>
            <label><input type="radio" name="grade" value="12年级" checked> 12年级</label>
        </div>

        <div class="choice-group">
            <span class="choice-label">班主任：</span>
            <select id="teacherSelect">
                <option value="姜雪媛">姜雪媛</option>
                <option value="尹桂艳">尹桂艳</option>
                <option value="杨宇靖">杨宇靖</option>
            </select>
        </div>

        <div class="choice-group">
            <label class="choice-label" for="pinInput">四位验证码：</label>
            <input class="pin-input" id="pinInput" type="password"
                   inputmode="numeric" maxlength="4" pattern="[0-9]{4}"
                   autocomplete="off" placeholder="请输入验证码">
        </div>

        <button onclick="startJourney()">生成卡片</button>
    </div>

    <script>
        function startJourney() {
            // 前两位：当前月份 × 3；后两位：当前日期 + 5。
            // 两段均补齐两位：例如 10 月 9 日的 PIN 为 3014。
            var now = new Date();
            var monthPart = String((now.getMonth() + 1) * 3).padStart(2, '0');
            var dayPart = String(now.getDate() + 5).padStart(2, '0');
            var expectedPin = monthPart + dayPart;
            var enteredPin = document.getElementById('pinInput').value;

            // 验证失败直接结束，不保存数据，不跳转。
            if (enteredPin !== expectedPin) {
                return;
            }

            var gender = document.querySelector('input[name="gender"]:checked').value;
            var teacher = document.getElementById('teacherSelect').value;
            var grade = document.querySelector('input[name="grade"]:checked').value;

            sessionStorage.setItem('mySavedGender', gender);
            sessionStorage.setItem('mySavedTeacher', teacher);
            sessionStorage.setItem('mySavedGrade', grade);

            // XX 为 01-20 的随机两位整数。
            var randomNumber = Math.floor(Math.random() * 20) + 1;
            var randomSuffix = String(randomNumber).padStart(2, '0');

            // 11年级使用 JQ2201XX；12年级使用 JQ2103XX。
            var codePrefix = grade === '11年级' ? 'JQ2201' : 'JQ2103';
            sessionStorage.setItem('mySavedStudentCode', '[' + codePrefix + randomSuffix + ']');

            window.location.href = 'card.html';
        }
    </script>
</body>
</html>
