<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="bootstrap-local.css" rel="stylesheet">
    <link href="site.css" rel="stylesheet">
    <title>门条</title>
</head>
<body>
<div class="bind-header">
    <img src="assets/brand.jpg" alt="账号">
</div>

<div id="out-container">
<table class="table table-striped table-bordered table-hover table-condensed">
    <thead>
    <tr>
        <th colspan="2">
            <span class="label label-info">注意:门卫点击下面按钮可准许学生外出</span>
        </th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td>学生姓名</td>
        <td id="student-name">[JQ2103XX]</td>
    </tr>
    <tr>
        <td>学生信息</td>
        <td id="student-info">男,12年级</td>
    </tr>
    <tr>
        <td>准假老师</td>
        <td id="teacher-name">姜雪媛</td>
    </tr>
    <tr>
        <td>离校日期</td>
        <td id="leave-date"></td>
    </tr>
    <tr>
        <td>离校情况</td>
        <td>
            <span class="label label-danger">独自离校</span>
            <br>
        </td>
    </tr>
    <tr>
        <td colspan="2" style="text-align:center">
            <img style="width:80px;height:106px" src="assets/none.png">
        </td>
    </tr>
    <tr>
        <td class="ctrl" colspan="2">
            <button class="btn btn-block btn-large btn-success action-pass-out" type="button">允许出门</button>
        </td>
    </tr>
    </tbody>
</table>
</div>

<script>
document.title = '门条';
(function () {
    var gender = sessionStorage.getItem('mySavedGender') || '男';
    var teacher = sessionStorage.getItem('mySavedTeacher') || '姜雪媛';
    var studentCode = sessionStorage.getItem('mySavedStudentCode') || '[JQ210301]';
    document.getElementById('student-name').textContent = studentCode;
    document.getElementById('student-info').textContent = gender + ',12年级';
    document.getElementById('teacher-name').textContent = teacher;

    var d = new Date();
    document.getElementById('leave-date').textContent =
        d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();

    document.querySelector('.action-pass-out').addEventListener('click', function () {
        window.location.href = 'pass.html';
    });
})();
</script>
</body>
</html>
